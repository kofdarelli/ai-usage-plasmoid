name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate helper syntax
        run: node --check package/contents/tools/ai-usage-status

      - name: Build plasmoid
        run: ./build.sh

      - name: Verify package archive
        run: for f in dist/*.plasmoid; do unzip -t "$f"; done

      - name: Upload plasmoid
        uses: actions/upload-artifact@v7
        with:
          name: ai-usage-plasmoid
          path: dist/*.plasmoid
          if-no-files-found: error
